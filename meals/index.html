<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mealtime</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="meals.css">
<script src="../platform/config.js"></script>
<script src="../platform/food.js"></script>
<script src="../platform/swipe.js"></script>
<script src="../platform/todo.js"></script>
<script src="../platform/claude.js" data-app="mealtime"></script>
<script>if (window.top !== window.self) { document.documentElement.classList.add('embedded'); document.documentElement.dataset.mode = new URLSearchParams(location.search).get('mode') === 'plan' ? 'plan' : 'meals'; }</script>

<header class="top">
  <div class="wrap">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M9 7c0-1.5 1-1.5 1-3M13 7c0-1.5 1-1.5 1-3"/></svg>Mealtime</div>
    <nav class="tabs" aria-label="Sections" data-sw-tabs>
      <button class="tab" data-act="tab" data-tab="recipes">Recipes</button>
      <button class="tab" data-act="tab" data-tab="plan">Week</button>
      <button class="tab" data-act="tab" data-tab="shopping">Shopping</button>
      <button class="tab" data-act="tab" data-tab="home">At home</button>
    </nav>
    <div class="status" id="status"></div>
    <button class="weeklink" id="weekLink" data-act="tab" data-tab="plan">See the week plan →</button>
  </div>
</header>
<main class="wrap" id="view">
  <div class="empty"><h2>Opening your kitchen</h2><p>Loading recipes, the family and your week plan…</p></div>
</main>
<div id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<!-- Meals itself: one file per part, sharing one scope (see CLAUDE.md) -->
<script src="js/data.js"></script>
<script src="js/family.js"></script>
<script src="js/ai.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/render.js"></script>
<script src="js/at-home.js"></script>
<script src="js/cook.js"></script>
<script src="js/sheets.js"></script>
<script src="js/actions.js"></script>
<script src="js/boot.js"></script>

</body></html>
